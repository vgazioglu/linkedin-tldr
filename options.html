<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn TL;DR settings</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 40px auto; color: #1d2226; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input, select { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
      .row input { width: auto; }
      button { margin-top: 20px; padding: 8px 16px; font: inherit; }
      #status { margin-left: 8px; color: #057642; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <h2>LinkedIn TL;DR</h2>
    <label for="apiKey">AI Gateway API key</label>
    <input id="apiKey" type="password" autocomplete="off" />
    <small>Vercel dashboard → AI Gateway → API Keys</small>

    <label for="model">Model</label>
    <select id="model"></select>

    <label for="language">Summary language</label>
    <input id="language" />

    <label for="minChars">Summarize posts longer than (characters)</label>
    <input id="minChars" type="number" min="0" step="20" />

    <div class="row"><input id="enabled" type="checkbox" /><span>Enabled</span></div>

    <button id="save">Save</button><span id="status"></span>
    <script type="module" src="options.js"></script>
  </body>
</html>
